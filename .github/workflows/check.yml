name: Leelo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libcryptsetup-dev pkg-config libssl-dev openssl swtpm swtpm-tools tpm2-tools cryptsetup-bin python3
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: bash scripts/test-tpm.sh
      - if: runner.os == 'Linux'
        run: bash scripts/test-e2e.sh
  proofs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify production policy and field arithmetic
        shell: pwsh
        run: ./scripts/verify.ps1 -InstallVerus
