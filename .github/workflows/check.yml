name: Leelo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtss2-dev libcryptsetup-dev pkg-config libssl-dev openssl swtpm swtpm-tools tpm2-tools cryptsetup-bin python3 python3-cryptography
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: python3 scripts/check-protocol-vector.py
      - if: runner.os == 'Linux'
        run: bash scripts/test-tpm.sh
      - if: runner.os == 'Linux'
        run: bash scripts/test-luks.sh
      - if: runner.os == 'Linux'
        run: bash scripts/test-enrollment-persistence.sh
      - if: runner.os == 'Linux'
        run: bash scripts/test-observability.sh
  monitoring:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract the distribution's promtool without installing a service
        run: |
          sudo apt-get update
          mkdir -p "$RUNNER_TEMP/leelo-promtool"
          cd "$RUNNER_TEMP/leelo-promtool"
          apt-get download prometheus
          dpkg-deb -x prometheus_*.deb extracted
      - name: Validate alert syntax and behavior
        run: |
          "$RUNNER_TEMP/leelo-promtool/extracted/usr/bin/promtool" check rules monitoring/alerts.yml
          "$RUNNER_TEMP/leelo-promtool/extracted/usr/bin/promtool" test rules monitoring/alerts.test.yml
  proofs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - name: Verify production policy, interpolation, and release
        shell: pwsh
        run: ./scripts/verify.ps1 -InstallVerus
