[package]
name = "leelo-crypto"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
description = "Fixed cryptographic profile for Leelo network-bound disk unlock"

[dependencies]
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["zeroize"] }
hkdf = "0.12.4"
p384 = { version = "0.13.1", default-features = false, features = ["hash2curve", "voprf"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2 = { version = "0.10.9", default-features = false }
voprf = { version = "=0.5.0", default-features = false }
zeroize = { version = "1.8.2", features = ["alloc"] }

[dev-dependencies]
hex = "0.4.3"
