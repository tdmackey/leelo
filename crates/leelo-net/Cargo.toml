[package]
name = "leelo-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leelo-protocol = { path = "../leelo-protocol" }
leelo-crypto = { path = "../leelo-crypto" }
leelo-engine = { path = "../leelo-engine" }
leelo-envelope = { path = "../leelo-envelope" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["system-config", "tokio"] }
tokio = { version = "1.49", features = ["rt", "time", "net"] }
