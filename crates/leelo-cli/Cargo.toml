[package]
name = "leelo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "leelo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
leelo-crypto = { path = "../leelo-crypto" }
leelo-envelope = { path = "../leelo-envelope" }
leelo-policy = { path = "../leelo-policy" }
leelo-engine = { path = "../leelo-engine" }
leelo-luks = { path = "../leelo-luks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = "1"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
leelo-tpm = { path = "../leelo-tpm" }
leelo-net = { path = "../leelo-net" }
libc = "0.2"
