[package]
name = "leelo-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded independent HTTPS and VOPRF evaluator probe"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
leelo-crypto = { path = "../leelo-crypto" }
leelo-envelope = { path = "../leelo-envelope" }
leelo-net = { path = "../leelo-net" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[dev-dependencies]
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.49", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
