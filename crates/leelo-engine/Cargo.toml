[package]
name = "leelo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leelo-policy = { path = "../leelo-policy" }
leelo-crypto = { path = "../leelo-crypto" }
leelo-sss = { path = "../leelo-sss" }
leelo-envelope = { path = "../leelo-envelope" }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1.8"
vstd = "=0.0.0-2026-06-14-0213"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { version = "1.49", features = ["rt", "time", "net"] }

[dev-dependencies]
leelo-protocol = { path = "../leelo-protocol" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)', 'cfg(verus_only)'] }
