# Optional /etc/systemd/system/leelo-key.service.d/observability.conf.
# Provision leelo-observe and /etc/leelo-observe/collector.env first; see README.
[Service]
SupplementaryGroups=leelo-observe
EnvironmentFile=/etc/leelo-observe/collector.env
Environment=LEELO_EVENTS_SOCKET=/run/leelo-observe/events.sock
RuntimeDirectory=leelo-key leelo-key-metrics
RuntimeDirectoryMode=0750
ExecStart=
ExecStart=/usr/local/bin/leelod worker --key /var/lib/leelo-key/evaluation.key --socket /run/leelo-key/evaluator.sock --allow-uid ${LEELO_HTTP_UID} --metrics-socket /run/leelo-key-metrics/metrics.sock --metrics-uid ${LEELO_COLLECTOR_UID} --metrics-gid ${LEELO_COLLECTOR_GID}
