# Optional /etc/systemd/system/leelo-http.service.d/observability.conf.
# Provision leelo-observe and /etc/leelo-observe/collector.env first; see README.
[Service]
SupplementaryGroups=leelo-observe
EnvironmentFile=/etc/leelo-observe/collector.env
Environment=LEELO_EVENTS_SOCKET=/run/leelo-observe/events.sock
RuntimeDirectory=leelo-http-metrics
RuntimeDirectoryMode=0750
ExecStart=
ExecStart=/usr/local/bin/leelod serve --listen 0.0.0.0:8443 --cert /etc/leelo-http/server.crt --tls-key /etc/leelo-http/server.key --worker-socket /run/leelo-key/evaluator.sock --metrics-socket /run/leelo-http-metrics/metrics.sock --metrics-uid ${LEELO_COLLECTOR_UID} --metrics-gid ${LEELO_COLLECTOR_GID}
