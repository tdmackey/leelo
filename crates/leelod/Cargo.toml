[package]
name = "leelod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
leelo-net = { path = "../leelo-net" }
leelo-crypto = { path = "../leelo-crypto" }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4.3"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
rustix = { version = "1.1", features = ["fs", "process"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
zeroize = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
tempfile = "3.20"
leelo-envelope = { path = "../leelo-envelope" }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0"
