[package]
name = "leelo-assurance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
leelo-crypto = { path = "../leelo-crypto" }
leelo-engine = { path = "../leelo-engine" }
leelo-envelope = { path = "../leelo-envelope" }
leelo-luks = { path = "../leelo-luks" }
leelo-policy = { path = "../leelo-policy" }
leelo-protocol = { path = "../leelo-protocol" }
leelo-sss = { path = "../leelo-sss" }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hex = "0.4.3"
p384 = { version = "0.13.1", default-features = false, features = ["hash2curve", "voprf"] }
rand_chacha = "0.3"
rand_core = "0.6"
serde_json = "1"
voprf = { version = "=0.5.0", default-features = false }
zeroize = "1.8"
